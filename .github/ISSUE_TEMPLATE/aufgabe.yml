name: Planungsaufgabe
description: Eine Aufgabe für Anforderungen, Entwurf oder Projektorganisation
title: "T-XX · "
labels: ["planung"]
body:
  - type: textarea
    id: result
    attributes:
      label: Ergebnis und Bezug
      description: Was soll entstehen? Dokument oder Story verlinken.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Fertig, wenn
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Planung
      value: |
        Zuständig: über Assignees festlegen
        Aufwand in Personenstunden:
        Abhängigkeiten:
        Zieltermin:
  - type: textarea
    id: evidence
    attributes:
      label: Ergebnis und Prüfung
      description: Nach Bearbeitung Ergebnislink und Prüfung ergänzen.
