name: User Story
description: Eine geplante Produktfunktion mit Nutzen, Kriterien und Aufgaben
title: "US-XX · "
labels: ["story", "prio:offen"]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      value: "Als … möchte ich …, damit …"
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Bezug und Planung
      value: |
        Ziel und Anforderung:
        Priorität: 10 (Rot) / 20 (Gelb) / 50 (Grün) / offen
        Phase: spätere Produktumsetzung
        Aufwand in Personenstunden: noch schätzen
        Offene Fragen:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: Woran erkennen wir, dass die Funktion erfüllt ist? Auch relevante Fehlerfälle nennen.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Aufgaben und Abhängigkeiten
      description: Kleine Arbeitsschritte und Links zu Planungsaufgaben. Größere Tasks später als eigenes Issue anlegen.
      value: "- [ ] "
