name: User Story
description: Ein Nutzerbedürfnis klären, priorisieren und mit dem Backlog verknüpfen
title: "[Story] "
body:
  - type: textarea
    id: story
    attributes:
      label: Rolle, Wunsch und Nutzen
      value: "Als … möchte ich …, damit …"
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Bezug und Planung
      value: |
        Story-ID und Link zum Backlog: offen
        Anforderung: offen
        Status: Entwurf
        Priorität (10 zuerst, 20 danach, 50 später): offen
        Aufwand mit Einheit und Annahmen: ungeschätzt
        Verantwortlich / Prüfung: offen
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien und Nutzenprüfung
      description: Beobachtbares Ergebnis sowie Fehler- oder Leerfall nennen. Freigegebene Kriterien ins Backlog übernehmen.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Aufgaben, Abhängigkeiten und offene Fragen
